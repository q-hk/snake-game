<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #1a1a2e;
    font-family: 'Courier New', monospace;
    color: #eee;
  }
  h1 {
    margin: 10px;
    color: #4ecca3;
  }
  #score {
    font-size: 24px;
    margin-bottom: 10px;
  }
  canvas {
    border: 3px solid #4ecca3;
    border-radius: 8px;
    background: #16213e;
    box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
  }
  #controls {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    color: #aaa;
  }
  #gameOver {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    padding: 30px 50px;
    border-radius: 10px;
    border: 2px solid #e94560;
  }
  #gameOver h2 {
    color: #e94560;
    margin: 0 0 10px 0;
  }
  #difficultyPanel {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.9);
    padding: 40px 50px;
    border-radius: 10px;
    border: 2px solid #4ecca3;
    z-index: 10;
  }
  #difficultyPanel h2 {
    color: #4ecca3;
    margin: 0 0 20px 0;
  }
  .diff-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .diff-btn {
    margin-top: 0;
    padding: 12px 20px;
    min-width: 100px;
  }
  .diff-btn.easy { background: #4ecca3; }
  .diff-btn.easy:hover { background: #45b393; }
  .diff-btn.medium { background: #f39c12; }
  .diff-btn.medium:hover { background: #e67e22; }
  .diff-btn.hard { background: #e94560; }
  .diff-btn.hard:hover { background: #d63851; }
  button {
    margin-top: 15px;
    padding: 10px 25px;
    background: #4ecca3;
    color: #16213e;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Courier New', monospace;
  }
  button:hover {
    background: #45b393;
  }
  #currentDiff {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
  }
  #soundToggle {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 6px 12px;
    font-size: 14px;
    background: transparent;
    border: 2px solid #4ecca3;
    color: #4ecca3;
    margin-top: 0;
  }
  #soundToggle:hover {
    background: rgba(78, 204, 163, 0.15);
  }
  #soundToggle.off {
    border-color: #666;
    color: #666;
  }
  #crowns {
    display: flex;
    gap: 15px;
    margin-bottom: 8px;
    align-items: center;
  }
  .crown-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .crown {
    font-size: 28px;
    filter: grayscale(1) brightness(0.4);
    transition: all 0.3s ease;
  }
  .crown.active {
    filter: none;
    animation: crownGlow 0.5s ease;
  }
  @keyframes crownGlow {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .crown-label {
    font-size: 12px;
    color: #666;
    margin-top: -5px;
  }
  .crown-label.active {
    color: #f39c12;
  }
</style>
</head>
<body>
  <button id="soundToggle" onclick="toggleSound()">🔊 音效开</button>
  <h1>🐍 SNAKE GAME</h1>
  <div id="crowns">
    <div class="crown-wrapper">
      <div class="crown" id="crown1">👑</div>
      <div class="crown-label" id="crownLabel1">10分</div>
    </div>
    <div class="crown-wrapper">
      <div class="crown" id="crown2">👑</div>
      <div class="crown-label" id="crownLabel2">20分</div>
    </div>
    <div class="crown-wrapper">
      <div class="crown" id="crown3">👑</div>
      <div class="crown-label" id="crownLabel3">30分</div>
    </div>
  </div>
  <div id="currentDiff">Select a difficulty to start</div>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="difficultyPanel">
    <h2>选择难度</h2>
    <div class="diff-buttons">
      <button class="diff-btn easy" onclick="startGame('easy')">😊 简单</button>
      <button class="diff-btn medium" onclick="startGame('medium')">😐 中等</button>
      <button class="diff-btn hard" onclick="startGame('hard')">😈 困难</button>
    </div>
  </div>
  <div id="gameOver">
    <h2>GAME OVER</h2>
    <div>Final Score: <span id="finalScore">0</span></div>
    <button onclick="restartGame()">重新选择难度</button>
  </div>
  <div id="controls">
    Use Arrow Keys or WASD to move<br>
    Press Space to pause/resume
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const difficultyPanel = document.getElementById('difficultyPanel');
const currentDiffEl = document.getElementById('currentDiff');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

const DIFFICULTY_SPEEDS = {
  easy: 180,
  medium: 120,
  hard: 70
};

const DIFFICULTY_NAMES = {
  easy: '😊 简单模式',
  medium: '😐 中等模式',
  hard: '😈 困难模式'
};

let snake, food, dx, dy, score, gameLoop, isPaused, isGameOver, currentSpeed, currentDiff;
let audioCtx, soundEnabled = true, bgmOscillator, bgmGain, bgmInterval;
const CROWN_THRESHOLDS = [10, 20, 30];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.2) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playEatSound() {
  playTone(880, 0.08, 'square', 0.15);
  setTimeout(() => playTone(1320, 0.1, 'square', 0.15), 60);
}

function playGameOverSound() {
  playTone(440, 0.15, 'sawtooth', 0.18);
  setTimeout(() => playTone(330, 0.15, 'sawtooth', 0.18), 120);
  setTimeout(() => playTone(220, 0.3, 'sawtooth', 0.2), 260);
}

function playMoveSound() {
  playTone(200, 0.03, 'sine', 0.06);
}

function playPauseSound(paused) {
  if (paused) {
    playTone(400, 0.1, 'triangle', 0.15);
  } else {
    playTone(600, 0.1, 'triangle', 0.15);
  }
}

function playButtonSound() {
  playTone(660, 0.06, 'sine', 0.12);
}

function playStartSound() {
  playTone(523, 0.1, 'triangle', 0.15);
  setTimeout(() => playTone(659, 0.1, 'triangle', 0.15), 100);
  setTimeout(() => playTone(784, 0.15, 'triangle', 0.15), 200);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggle');
  if (soundEnabled) {
    btn.textContent = '🔊 音效开';
    btn.classList.remove('off');
    initAudio();
    playButtonSound();
    if (!isGameOver && difficultyPanel.style.display === 'none') startBGM();
  } else {
    btn.textContent = '🔇 音效关';
    btn.classList.add('off');
    stopBGM();
  }
}

const BGM_NOTES = [262, 294, 330, 349, 392, 349, 330, 294];
let bgmNoteIndex = 0;

function startBGM() {
  if (!soundEnabled || !audioCtx) return;
  stopBGM();
  bgmNoteIndex = 0;
  bgmInterval = setInterval(() => {
    if (!soundEnabled || isPaused || isGameOver) return;
    playTone(BGM_NOTES[bgmNoteIndex % BGM_NOTES.length], 0.2, 'triangle', 0.06);
    bgmNoteIndex++;
  }, 350);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function playCrownSound() {
  playTone(784, 0.1, 'triangle', 0.18);
  setTimeout(() => playTone(988, 0.1, 'triangle', 0.18), 80);
  setTimeout(() => playTone(1175, 0.15, 'triangle', 0.2), 160);
}

function init() {
  snake = [{x: 10, y: 10}];
  food = randomFood();
  dx = 0;
  dy = 0;
  score = 0;
  isPaused = false;
  isGameOver = false;
  scoreEl.textContent = 'Score: 0';
  gameOverEl.style.display = 'none';
  resetCrowns();
}

function resetCrowns() {
  for (let i = 1; i <= 3; i++) {
    document.getElementById('crown' + i).classList.remove('active');
    document.getElementById('crownLabel' + i).classList.remove('active');
  }
}

function updateCrowns() {
  for (let i = 0; i < CROWN_THRESHOLDS.length; i++) {
    const crownEl = document.getElementById('crown' + (i + 1));
    const labelEl = document.getElementById('crownLabel' + (i + 1));
    if (score >= CROWN_THRESHOLDS[i]) {
      if (!crownEl.classList.contains('active')) {
        crownEl.classList.add('active');
        labelEl.classList.add('active');
        playCrownSound();
      }
    }
  }
}

function startGame(diff) {
  initAudio();
  playButtonSound();
  setTimeout(playStartSound, 80);
  currentDiff = diff;
  currentSpeed = DIFFICULTY_SPEEDS[diff];
  currentDiffEl.textContent = '当前难度: ' + DIFFICULTY_NAMES[diff];
  difficultyPanel.style.display = 'none';
  init();
  clearInterval(gameLoop);
  gameLoop = setInterval(gameStep, currentSpeed);
  startBGM();
}

function randomFood() {
  let f;
  while (true) {
    f = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) break;
  }
  return f;
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(78, 204, 163, 0.08)';
  for (let i = 0; i < tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(
    food.x * gridSize + gridSize / 2,
    food.y * gridSize + gridSize / 2,
    gridSize / 2 - 2,
    0, Math.PI * 2
  );
  ctx.fill();

  snake.forEach((seg, i) => {
    if (i === 0) {
      ctx.fillStyle = '#4ecca3';
    } else {
      const shade = Math.max(40, 160 - i * 5);
      ctx.fillStyle = `rgb(${shade * 0.3}, ${shade}, ${shade * 0.8})`;
    }
    ctx.fillRect(
      seg.x * gridSize + 1,
      seg.y * gridSize + 1,
      gridSize - 2,
      gridSize - 2
    );

    if (i === 0) {
      ctx.fillStyle = '#16213e';
      const eyeSize = 3;
      let eye1X, eye1Y, eye2X, eye2Y;
      if (dx === 1) {
        eye1X = seg.x * gridSize + gridSize - 6; eye1Y = seg.y * gridSize + 5;
        eye2X = seg.x * gridSize + gridSize - 6; eye2Y = seg.y * gridSize + gridSize - 8;
      } else if (dx === -1) {
        eye1X = seg.x * gridSize + 3; eye1Y = seg.y * gridSize + 5;
        eye2X = seg.x * gridSize + 3; eye2Y = seg.y * gridSize + gridSize - 8;
      } else if (dy === 1) {
        eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + gridSize - 6;
        eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + gridSize - 6;
      } else {
        eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + 3;
        eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + 3;
      }
      ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
      ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);
    }
  });

  if (isPaused && !isGameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4ecca3';
    ctx.font = '36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

function update() {
  if (isPaused || isGameOver) return;
  if (dx === 0 && dy === 0) return;

  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    food = randomFood();
    playEatSound();
    updateCrowns();
  } else {
    snake.pop();
  }
}

function endGame() {
  isGameOver = true;
  clearInterval(gameLoop);
  stopBGM();
  finalScoreEl.textContent = score;
  gameOverEl.style.display = 'flex';
  playGameOverSound();
}

function gameStep() {
  update();
  draw();
}

function restartGame() {
  initAudio();
  playButtonSound();
  gameOverEl.style.display = 'none';
  currentDiffEl.textContent = 'Select a difficulty to start';
  difficultyPanel.style.display = 'flex';
  clearInterval(gameLoop);
  init();
  draw();
}

document.addEventListener('keydown', e => {
  if (difficultyPanel.style.display !== 'none') return;
  initAudio();
  const key = e.key.toLowerCase();
  if (key === ' ') {
    e.preventDefault();
    if (!isGameOver) {
      isPaused = !isPaused;
      playPauseSound(isPaused);
    }
    return;
  }
  let moved = false;
  if ((key === 'arrowup' || key === 'w') && dy !== 1) { dx = 0; dy = -1; moved = true; }
  else if ((key === 'arrowdown' || key === 's') && dy !== -1) { dx = 0; dy = 1; moved = true; }
  else if ((key === 'arrowleft' || key === 'a') && dx !== 1) { dx = -1; dy = 0; moved = true; }
  else if ((key === 'arrowright' || key === 'd') && dx !== -1) { dx = 1; dy = 0; moved = true; }
  if (moved) playMoveSound();
});

init();
draw();
</script>
</body>
</html>
