<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #1a1a2e;

  }

  #gameOver h2 {

  #difficultyPanel {

    justify-content: center;

    z-index: 10;
  }
  #difficultyPanel h2 {

  .diff-buttons {

  .diff-btn {

  button {

  #soundToggle {

    background: rgba(78, 204, 163, 0.15);

  #userInfo {

  }
  #logoutBtn {

    padding: 6px 12px;

  }

  #authPanel {

    flex-direction: column;

    justify-content: center;

    border: 2px solid #4ecca3;

  body.auth-mode::before {

  #authPanel h2 {

  }
  .auth-tab {

    padding: 10px;
    background: transparent;
    border: 2px solid #4ecca3;
    color: #4ecca3;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    margin: 0;
  }
  .auth-tab:first-child {
    border-radius: 5px 0 0 5px;

  .auth-tab:last-child {

  }
  .auth-tab.active {

  }
  #authPanel input {
    width: 100%;

    border: 2px solid #4ecca3;

    font-size: 16px;

  .device-btn:hover {

    color: #16213e;

  }
  .device-btn .icon {
    font-size: 40px;
    margin-bottom: 10px;
  }
  #mobileControls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 5px;
  }
  .dpad-btn {
    background: rgba(78, 204, 163, 0.3);
    border: 2px solid #4ecca3;
    border-radius: 10px;
    color: #4ecca3;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .dpad-btn:active {
    background: #4ecca3;
    color: #16213e;

  }
  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-pause { grid-column: 2; grid-row: 2; font-size: 18px; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 3; }
  #crowns {
    display: flex;
    gap: 15px;
    margin-bottom: 8px;

  .crown-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;

    font-size: 28px;

    transition: all 0.3s ease;
  }
  .crown.active {
    filter: none;
    animation: crownGlow 0.5s ease;
  }
  @keyframes crownGlow {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .crown-label {
    font-size: 12px;
    color: #666;
    margin-top: -5px;
  }
  .crown-label.active {
    color: #f39c12;
  }
  #historyPanel {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.92);

    border-radius: 10px;
    border: 2px solid #4ecca3;
    z-index: 20;

    color: #4ecca3;

    overflow-y: auto;
    width: 100%;
    margin-bottom: 15px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(78,204,163,0.2);
    font-size: 14px;
  }
  .history-item:nth-child(odd) {
    background: rgba(78,204,163,0.05);
  }
  .history-item .h-date { color: #aaa; }
  .history-item .h-mode { color: #3498db; margin-right: 8px; }
  .history-item .h-diff { color: #f39c12; }
  .history-item .h-score { color: #4ecca3; font-weight: bold; }
  .history-item .h-aiscore { color: #e94560; font-weight: bold; }
  .history-btns {
    display: flex;
    gap: 10px;
  }
  .history-btns button {
    margin-top: 0;
    padding: 8px 16px;
    font-size: 14px;
  }
  .btn-clear {
    background: #e94560;
    color: #eee;
  }
  .btn-clear:hover {
    background: #d63851;
  }
  .no-history {
    color: #666;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>
  <button id="soundToggle" onclick="toggleSound()">🔊 音效开</button>
  <button id="historyToggle" onclick="showHistory()" style="position:absolute;top:15px;left:15px;padding:6px 12px;font-size:14px;background:transparent;border:2px solid #f39c12;color:#f39c12;margin-top:0;">📜 历史记录</button>
  <div id="userInfo">👤 <span id="currentUser"></span></div>

  <div id="crowns">
    <div class="crown-wrapper">

    <div class="crown-wrapper">

      <button class="diff-btn medium" onclick="startPvPGame('medium')">😐 中等AI</button>

      <div class="dpad-btn dpad-up" ontouchstart="moveDir('up')" onclick="moveDir('up')">▲</div>

      <div class="dpad-btn dpad-right" ontouchstart="moveDir('right')" onclick="moveDir('right')">▶</div>

    <span id="controlsText">单人模式：方向键或WASD移动 | 对战模式：WASD控制你的蛇（绿色）<br>按空格键暂停/继续</span>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const gameOverInfo = document.getElementById('gameOverInfo');
const difficultyPanel = document.getElementById('difficultyPanel');
const pvpDifficultyPanel = document.getElementById('pvpDifficultyPanel');
const gameModePanel = document.getElementById('gameModePanel');
const currentDiffEl = document.getElementById('currentDiff');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const scoresDiv = document.getElementById('scores');
const p1ScoreEl = document.getElementById('p1Score');
const p2ScoreEl = document.getElementById('p2Score');
const authPanel = document.getElementById('authPanel');
const authKeyInput = document.getElementById('authKey');
const authErrorEl = document.getElementById('authError');
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const userInfo = document.getElementById('userInfo');
const currentUserEl = document.getElementById('currentUser');
const logoutBtn = document.getElementById('logoutBtn');
const devicePanel = document.getElementById('devicePanel');
const mobileControls = document.getElementById('mobileControls');

const HISTORY_KEY = 'snake_game_history';
const MAX_HISTORY = 50;
const CURRENT_USER_KEY = 'snake_current_user';
const DEVICE_KEY = 'snake_device_';
let authMode = 'login';
let currentUser = null;
let currentDevice = 'pc';

const gridSize = 20;
const tileCount = canvas.width / gridSize;

const DIFFICULTY_SPEEDS = {
  easy: 180,
  medium: 120,
  hard: 70
};

const AI_SMARTNESS = {
  easy: 0.3,
  medium: 0.6,
  hard: 0.95
};

const DIFFICULTY_NAMES = {
  easy: '😊 简单',
  medium: '😐 中等',
  hard: '😈 困难'
};

const MODE_NAMES = {
  single: '单人',
  pvp: '对战'
};

let snake, food, dx, dy, score, gameLoop, isPaused, isGameOver, currentSpeed, currentDiff;
let snake2, dx2, dy2, score2;
let gameMode = 'single';
let audioCtx, soundEnabled = true, bgmOscillator, bgmGain, bgmInterval;
const CROWN_THRESHOLDS = [30, 50, 100];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.2) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playEatSound() {
  playTone(880, 0.08, 'square', 0.15);
  setTimeout(() => playTone(1320, 0.1, 'square', 0.15), 60);
}

function playGameOverSound() {
  playTone(440, 0.15, 'sawtooth', 0.18);
  setTimeout(() => playTone(330, 0.15, 'sawtooth', 0.18), 120);
  setTimeout(() => playTone(220, 0.3, 'sawtooth', 0.2), 260);
}

function playMoveSound() {
  playTone(200, 0.03, 'sine', 0.06);
}

function playPauseSound(paused) {
  if (paused) {
    playTone(400, 0.1, 'triangle', 0.15);
  } else {
    playTone(600, 0.1, 'triangle', 0.15);
  }
}

function playButtonSound() {
  playTone(660, 0.06, 'sine', 0.12);
}

function playStartSound() {
  playTone(523, 0.1, 'triangle', 0.15);
  setTimeout(() => playTone(659, 0.1, 'triangle', 0.15), 100);
  setTimeout(() => playTone(784, 0.15, 'triangle', 0.15), 200);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggle');
  if (soundEnabled) {
    btn.textContent = '🔊 音效开';
    btn.classList.remove('off');
    initAudio();
    playButtonSound();
    if (!isGameOver && difficultyPanel.style.display === 'none') startBGM();
  } else {
    btn.textContent = '🔇 音效关';
    btn.classList.add('off');
    stopBGM();
  }
}

const BGM_NOTES = [262, 294, 330, 349, 392, 349, 330, 294];
let bgmNoteIndex = 0;

function startBGM() {
  if (!soundEnabled || !audioCtx) return;
  stopBGM();
  bgmNoteIndex = 0;
  bgmInterval = setInterval(() => {
    if (!soundEnabled || isPaused || isGameOver) return;
    playTone(BGM_NOTES[bgmNoteIndex % BGM_NOTES.length], 0.2, 'triangle', 0.06);
    bgmNoteIndex++;
  }, 350);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

function playCrownSound() {
  playTone(784, 0.1, 'triangle', 0.18);
  setTimeout(() => playTone(988, 0.1, 'triangle', 0.18), 80);
  setTimeout(() => playTone(1175, 0.15, 'triangle', 0.2), 160);
}

function init() {
  snake = [{x: 10, y: 10}];
  food = randomFood();
  dx = 0;
  dy = 0;
  score = 0;
  isPaused = false;
  isGameOver = false;
  if (scoreEl) scoreEl.textContent = 'Score: 0';
  gameOverEl.style.display = 'none';
  resetCrowns();
}

function initPvP() {
  snake = [{x: 5, y: 10}];
  snake2 = [{x: 15, y: 10}];
  dx = 0;
  dy = 0;
  dx2 = 0;
  dy2 = 0;
  score = 0;
  score2 = 0;
  isPaused = false;
  isGameOver = false;
  food = randomFoodPvP();
  updatePvPScores();
  gameOverEl.style.display = 'none';
  scoresDiv.style.display = 'flex';
  p1ScoreEl.classList.remove('winner');
  p2ScoreEl.classList.remove('winner');
  resetCrowns();
}

function updatePvPScores() {
  p1ScoreEl.textContent = '玩家: ' + score + '分';
  p2ScoreEl.textContent = 'AI: ' + score2 + '分';
}

function resetCrowns() {
  for (let i = 1; i <= 3; i++) {
    document.getElementById('crown' + i).classList.remove('active');
    document.getElementById('crownLabel' + i).classList.remove('active');
  }
}

function updateCrowns() {
  for (let i = 0; i < CROWN_THRESHOLDS.length; i++) {
    const crownEl = document.getElementById('crown' + (i + 1));
    const labelEl = document.getElementById('crownLabel' + (i + 1));
    if (score >= CROWN_THRESHOLDS[i]) {
      if (!crownEl.classList.contains('active')) {
        crownEl.classList.add('active');
        labelEl.classList.add('active');
        playCrownSound();
      }
    }
  }
}

function startGame(diff) {
  initAudio();
  playButtonSound();
  setTimeout(playStartSound, 80);
  currentDiff = diff;
  currentSpeed = DIFFICULTY_SPEEDS[diff];
  currentDiffEl.textContent = '当前难度: ' + DIFFICULTY_NAMES[diff];
  gameModePanel.style.display = 'none';
  difficultyPanel.style.display = 'none';
  scoresDiv.style.display = 'none';
  scoreEl.style.display = 'block';
  if (currentDevice === 'mobile') {
    mobileControls.style.display = 'block';
  }
  gameMode = 'single';
  init();
  clearInterval(gameLoop);
  gameLoop = setInterval(gameStep, currentSpeed);
  startBGM();
}

function showDifficultySelect() {
  initAudio();
  playButtonSound();
  gameModePanel.style.display = 'none';
  difficultyPanel.style.display = 'flex';
}

function showPvPDifficultySelect() {
  initAudio();
  playButtonSound();
  gameModePanel.style.display = 'none';
  pvpDifficultyPanel.style.display = 'flex';
}

function backToMode() {
  initAudio();
  playButtonSound();
  difficultyPanel.style.display = 'none';
  pvpDifficultyPanel.style.display = 'none';
  gameModePanel.style.display = 'flex';
}

function startPvP() {
  showPvPDifficultySelect();
}

function startPvPGame(diff) {
  initAudio();
  playButtonSound();
  setTimeout(playStartSound, 80);
  currentDiff = diff;
  currentSpeed = DIFFICULTY_SPEEDS[diff];
  currentDiffEl.textContent = '⚔️ 对战模式 - AI' + DIFFICULTY_NAMES[diff];
  gameModePanel.style.display = 'none';
  pvpDifficultyPanel.style.display = 'none';
  scoreEl.style.display = 'none';
  if (currentDevice === 'mobile') {
    mobileControls.style.display = 'block';
  }
  gameMode = 'pvp';
  initPvP();
  clearInterval(gameLoop);
  gameLoop = setInterval(gameStep, currentSpeed);
  startBGM();
}

function randomFood() {
  let f;
  while (true) {
    f = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) break;
  }
  return f;
}

function randomFoodPvP() {
  let f;
  while (true) {
    f = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    if (!snake.some(s => s.x === f.x && s.y === f.y) && 
        !snake2.some(s => s.x === f.x && s.y === f.y)) break;
  }
  return f;
}

function aiMove() {
  const head = snake2[0];
  const directions = [
    {dx: 0, dy: -1},
    {dx: 0, dy: 1},
    {dx: -1, dy: 0},
    {dx: 1, dy: 0}
  ];
  
  const safeDirections = directions.filter(dir => {
    if (dir.dx === -dx2 && dir.dy === -dy2 && (dx2 !== 0 || dy2 !== 0)) return false;
    const newX = head.x + dir.dx;
    const newY = head.y + dir.dy;
    if (newX < 0 || newX >= tileCount || newY < 0 || newY >= tileCount) return false;
    if (snake.some(s => s.x === newX && s.y === newY)) return false;
    if (snake2.some((s, i) => i > 0 && s.x === newX && s.y === newY)) return false;
    return true;
  });
  
  if (safeDirections.length === 0) return;
  
  const smartness = AI_SMARTNESS[currentDiff] || 0.6;
  
  if (Math.random() > smartness) {
    const randomDir = safeDirections[Math.floor(Math.random() * safeDirections.length)];
    dx2 = randomDir.dx;
    dy2 = randomDir.dy;
    return;
  }
  
  const scored = safeDirections.map(dir => {
    const newX = head.x + dir.dx;
    const newY = head.y + dir.dy;
    const distToFood = Math.abs(newX - food.x) + Math.abs(newY - food.y);
    const distToPlayer = Math.abs(newX - snake[0].x) + Math.abs(newY - snake[0].y);
    let dirScore = -distToFood;
    if (distToPlayer < 3) dirScore -= 10;
    if (distToPlayer < 2) dirScore -= 20;
    return {dir, dirScore};
  });
  
  scored.sort((a, b) => b.dirScore - a.dirScore);
  const best = scored[0].dir;
  dx2 = best.dx;
  dy2 = best.dy;
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(78, 204, 163, 0.08)';
  for (let i = 0; i < tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(
    food.x * gridSize + gridSize / 2,
    food.y * gridSize + gridSize / 2,
    gridSize / 2 - 2,
    0, Math.PI * 2
  );
  ctx.fill();

  snake.forEach((seg, i) => {
    if (i === 0) {
      ctx.fillStyle = '#4ecca3';
    } else {
      const shade = Math.max(40, 160 - i * 5);
      ctx.fillStyle = `rgb(${shade * 0.3}, ${shade}, ${shade * 0.8})`;
    }
    ctx.fillRect(
      seg.x * gridSize + 1,
      seg.y * gridSize + 1,
      gridSize - 2,
      gridSize - 2
    );

    if (i === 0) {
      ctx.fillStyle = '#16213e';
      const eyeSize = 3;
      let eye1X, eye1Y, eye2X, eye2Y;
      if (dx === 1 || (dx === 0 && dy === 0)) {
        eye1X = seg.x * gridSize + gridSize - 6; eye1Y = seg.y * gridSize + 5;
        eye2X = seg.x * gridSize + gridSize - 6; eye2Y = seg.y * gridSize + gridSize - 8;
      } else if (dx === -1) {
        eye1X = seg.x * gridSize + 3; eye1Y = seg.y * gridSize + 5;
        eye2X = seg.x * gridSize + 3; eye2Y = seg.y * gridSize + gridSize - 8;
      } else if (dy === 1) {
        eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + gridSize - 6;
        eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + gridSize - 6;
      } else {
        eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + 3;
        eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + 3;
      }
      ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
      ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);
    }
  });

  if (gameMode === 'pvp' && snake2) {
    snake2.forEach((seg, i) => {
      if (i === 0) {
        ctx.fillStyle = '#3498db';
      } else {
        const shade = Math.max(40, 140 - i * 5);
        ctx.fillStyle = `rgb(${shade * 0.2}, ${shade * 0.5}, ${shade})`;
      }
      ctx.fillRect(
        seg.x * gridSize + 1,
        seg.y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
      );

      if (i === 0) {
        ctx.fillStyle = '#16213e';
        const eyeSize = 3;
        let eye1X, eye1Y, eye2X, eye2Y;
        if (dx2 === -1 || (dx2 === 0 && dy2 === 0)) {
          eye1X = seg.x * gridSize + 3; eye1Y = seg.y * gridSize + 5;
          eye2X = seg.x * gridSize + 3; eye2Y = seg.y * gridSize + gridSize - 8;
        } else if (dx2 === 1) {
          eye1X = seg.x * gridSize + gridSize - 6; eye1Y = seg.y * gridSize + 5;
          eye2X = seg.x * gridSize + gridSize - 6; eye2Y = seg.y * gridSize + gridSize - 8;
        } else if (dy2 === 1) {
          eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + gridSize - 6;
          eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + gridSize - 6;
        } else {
          eye1X = seg.x * gridSize + 5; eye1Y = seg.y * gridSize + 3;
          eye2X = seg.x * gridSize + gridSize - 8; eye2Y = seg.y * gridSize + 3;
        }
        ctx.fillRect(eye1X, eye1Y, eyeSize, eyeSize);
        ctx.fillRect(eye2X, eye2Y, eyeSize, eyeSize);
      }
    });
  }

  if (isPaused && !isGameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4ecca3';
    ctx.font = '36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }
}

function update() {
  if (isPaused || isGameOver) return;
  
  if (gameMode === 'single') {
    if (dx === 0 && dy === 0) return;
    updateSnake();
  } else {
    if (dx === 0 && dy === 0) return;
    aiMove();
    updateSnake();
    updateSnake2();
    checkPvPCollision();
  }
}

function updateSnake() {
  if (dx === 0 && dy === 0) return;
  
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  if (gameMode === 'pvp' && snake2.some(s => s.x === head.x && s.y === head.y)) {
    endGame('你撞到了AI蛇！');
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (gameMode === 'single') {
      scoreEl.textContent = 'Score: ' + score;
    } else {
      updatePvPScores();
    }
    food = gameMode === 'pvp' ? randomFoodPvP() : randomFood();
    playEatSound();
    updateCrowns();
  } else {
    snake.pop();
  }
}

function updateSnake2() {
  if (dx2 === 0 && dy2 === 0) return;
  
  const head = {x: snake2[0].x + dx2, y: snake2[0].y + dy2};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame('AI撞墙了！你赢了！');
    p1ScoreEl.classList.add('winner');
    return;
  }

  if (snake2.some(s => s.x === head.x && s.y === head.y)) {
    endGame('AI撞到自己了！你赢了！');
    p1ScoreEl.classList.add('winner');
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame('AI撞到了你的蛇！你赢了！');
    p1ScoreEl.classList.add('winner');
    return;
  }

  snake2.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score2 += 10;
    updatePvPScores();
    food = randomFoodPvP();
    playEatSound();
  } else {
    snake2.pop();
  }
}

function checkPvPCollision() {
  const head1 = snake[0];
  const head2 = snake2[0];
  
  if (head1.x === head2.x && head1.y === head2.y) {
    if (score > score2) {
      endGame('平局！但你分数更高');
    } else if (score < score2) {
      endGame('平局！AI分数更高');
      p2ScoreEl.classList.add('winner');
    } else {
      endGame('完全平局！');
    }
  }
}

function endGame(message) {
  isGameOver = true;
  clearInterval(gameLoop);
  stopBGM();
  mobileControls.style.display = 'none';
  finalScoreEl.textContent = score;
  gameOverInfo.textContent = message || '';
  if (gameMode === 'pvp') {
    gameOverInfo.textContent = (message ? message + '\n' : '') + '玩家: ' + score + '分 | AI: ' + score2 + '分';
  }
  gameOverEl.style.display = 'flex';
  playGameOverSound();
  saveToHistory(score, score2, currentDiff, gameMode);
}

function gameStep() {
  update();
  draw();
}

function restartGame() {
  initAudio();
  playButtonSound();
  gameOverEl.style.display = 'none';
  scoresDiv.style.display = 'none';
  scoreEl.style.display = 'block';
  currentDiffEl.textContent = '选择游戏模式开始';
  gameModePanel.style.display = 'flex';
  difficultyPanel.style.display = 'none';
  pvpDifficultyPanel.style.display = 'none';
  clearInterval(gameLoop);
  init();
  draw();
}

function getHistory() {
  try {
    const key = currentUser ? HISTORY_KEY + '_' + currentUser : HISTORY_KEY;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function saveToHistory(playerScore, aiScore, diff, mode) {
  const history = getHistory();
  const now = new Date();
  const entry = {
    date: now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
    score: playerScore,
    aiScore: mode === 'pvp' ? aiScore : null,
    difficulty: DIFFICULTY_NAMES[diff] || diff,
    mode: MODE_NAMES[mode] || mode
  };
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
  const key = currentUser ? HISTORY_KEY + '_' + currentUser : HISTORY_KEY;
  localStorage.setItem(key, JSON.stringify(history));
}

function showHistory() {
  initAudio();
  playButtonSound();
  if (!currentUser) {
    historyPanel.style.display = 'flex';
    historyList.innerHTML = '<div class="no-history">请先登录后查看历史记录</div>';
    return;
  }
  const history = getHistory();
  historyPanel.style.display = 'flex';
  if (history.length === 0) {
    historyList.innerHTML = '<div class="no-history">暂无记录，快去玩一局吧！</div>';
  } else {
    let html = '';
    history.forEach((item, index) => {
      const mode = item.mode || '单人';
      const modeTag = '<span class="h-mode">[' + mode + ']</span>';
      const aiScoreTag = item.aiScore !== null && item.aiScore !== undefined ? '<span class="h-aiscore">AI:' + item.aiScore + '分</span>' : '';
      html += '<div class="history-item">' +
        '<span class="h-date">' + item.date + '</span>' +
        modeTag +
        '<span class="h-diff">' + item.difficulty + '</span>' +
        '<span class="h-score">' + item.score + '分</span>' +
        aiScoreTag +
        '</div>';
    });
    historyList.innerHTML = html;
  }
}

function closeHistory() {
  playButtonSound();
  historyPanel.style.display = 'none';
}

function clearHistory() {
  playButtonSound();
  if (!currentUser) {
    localStorage.removeItem(HISTORY_KEY);
  } else {
    localStorage.removeItem(HISTORY_KEY + '_' + currentUser);
  }
  historyList.innerHTML = '<div class="no-history">记录已清空</div>';
  setTimeout(() => {
    historyPanel.style.display = 'none';
  }, 800);
}

function validateKey(key) {
  return /^[A-Za-z0-9]{8}$/.test(key);
}

function switchAuthTab(mode) {
  authMode = mode;
  playButtonSound();
  if (mode === 'login') {
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
  } else {
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
  }
  authKeyInput.classList.remove('error');
  authErrorEl.textContent = '';
  authKeyInput.value = '';
  authKeyInput.focus();
}

function submitAuth() {
  const key = authKeyInput.value.trim();
  authKeyInput.classList.remove('error');
  authErrorEl.textContent = '';

  if (!validateKey(key)) {
    authKeyInput.classList.add('error');
    authErrorEl.textContent = '密钥格式错误！只能字母和数字，必须8位';
    return;
  }

  initAudio();
  playButtonSound();

  if (authMode === 'register') {
    const users = JSON.parse(localStorage.getItem('snake_users') || '[]');
    if (users.includes(key)) {
      authKeyInput.classList.add('error');
      authErrorEl.textContent = '该密钥已被注册，请直接登录';
      return;
    }
    users.push(key);
    localStorage.setItem('snake_users', JSON.stringify(users));
  } else {
    const users = JSON.parse(localStorage.getItem('snake_users') || '[]');
    if (!users.includes(key)) {
      authKeyInput.classList.add('error');
      authErrorEl.textContent = '密钥不存在，请先注册或检查是否输入正确';
      return;
    }
  }

  login(key);
}

function login(key) {
  currentUser = key;
  localStorage.setItem(CURRENT_USER_KEY, key);
  authPanel.style.display = 'none';
  document.body.classList.remove('auth-mode');
  
  const savedDevice = localStorage.getItem(DEVICE_KEY + key);
  if (savedDevice) {
    selectDevice(savedDevice, true);
  } else {
    const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isMobile) {
      selectDevice('mobile', true);
    } else {
      devicePanel.style.display = 'flex';
      document.body.classList.add('auth-mode');
    }
  }
  
  userInfo.style.display = 'block';
  currentUserEl.textContent = key;
  logoutBtn.style.display = 'block';
}

function selectDevice(device, skipSave) {
  currentDevice = device;
  if (!skipSave && currentUser) {
    localStorage.setItem(DEVICE_KEY + currentUser, device);
  }
  devicePanel.style.display = 'none';
  document.body.classList.remove('auth-mode');
  
  const controlsText = document.getElementById('controlsText');
  
  if (device === 'mobile') {
    mobileControls.style.display = 'none';
    if (controlsText) {
      controlsText.innerHTML = '📱 触屏控制：开始游戏后显示方向按钮';
    }
  } else {
    mobileControls.style.display = 'none';
    if (controlsText) {
      controlsText.innerHTML = '单人模式：方向键或WASD移动 | 对战模式：WASD控制你的蛇（绿色）<br>按空格键暂停/继续';
    }
  }
  
  gameModePanel.style.display = 'flex';
}

function moveDir(dir) {
  initAudio();
  if (isGameOver) return;
  
  if (gameMode === 'pvp') {
    if (dir === 'up' && dy !== 1) { dx = 0; dy = -1; }
    else if (dir === 'down' && dy !== -1) { dx = 0; dy = 1; }
    else if (dir === 'left' && dx !== 1) { dx = -1; dy = 0; }
    else if (dir === 'right' && dx !== -1) { dx = 1; dy = 0; }
  } else {
    if (dir === 'up' && dy !== 1) { dx = 0; dy = -1; }
    else if (dir === 'down' && dy !== -1) { dx = 0; dy = 1; }
    else if (dir === 'left' && dx !== 1) { dx = -1; dy = 0; }
    else if (dir === 'right' && dx !== -1) { dx = 1; dy = 0; }
  }
  playMoveSound();
}

function togglePauseMobile() {
  initAudio();
  if (!isGameOver) {
    isPaused = !isPaused;
    playPauseSound(isPaused);
  }
}

function logout() {
  playButtonSound();
  currentUser = null;
  localStorage.removeItem(CURRENT_USER_KEY);
  userInfo.style.display = 'none';
  logoutBtn.style.display = 'none';
  mobileControls.style.display = 'none';
  devicePanel.style.display = 'none';
  clearInterval(gameLoop);
  scoresDiv.style.display = 'none';
  scoreEl.style.display = 'none';
  currentDiffEl.textContent = '请登录后开始游戏';
  gameModePanel.style.display = 'none';
  difficultyPanel.style.display = 'none';
  pvpDifficultyPanel.style.display = 'none';
  gameOverEl.style.display = 'none';
  historyPanel.style.display = 'none';
  authPanel.style.display = 'flex';
  document.body.classList.add('auth-mode');
  authKeyInput.value = '';
  switchAuthTab('login');
}

document.addEventListener('keydown', e => {
  if (authPanel.style.display !== 'none') {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitAuth();
    }
    return;
  }
  if (gameModePanel.style.display !== 'none' || difficultyPanel.style.display !== 'none' || pvpDifficultyPanel.style.display !== 'none') return;
  initAudio();
  const key = e.key.toLowerCase();
  if (key === ' ') {
    e.preventDefault();
    if (!isGameOver) {
      isPaused = !isPaused;
      playPauseSound(isPaused);
    }
    return;
  }
  let moved = false;
  if ((key === 'arrowup' || key === 'w') && dy !== 1) { dx = 0; dy = -1; moved = true; }
  else if ((key === 'arrowdown' || key === 's') && dy !== -1) { dx = 0; dy = 1; moved = true; }
  else if ((key === 'arrowleft' || key === 'a') && dx !== 1) { dx = -1; dy = 0; moved = true; }
  else if ((key === 'arrowright' || key === 'd') && dx !== -1) { dx = 1; dy = 0; moved = true; }
  if (moved) playMoveSound();
});

function appStart() {
  init();
  draw();
  authPanel.style.display = 'flex';
  document.body.classList.add('auth-mode');
  gameModePanel.style.display = 'none';
  scoresDiv.style.display = 'none';
  scoreEl.style.display = 'none';
  currentDiffEl.textContent = '请登录后开始游戏';
  authKeyInput.focus();

  const savedUser = localStorage.getItem(CURRENT_USER_KEY);
  if (savedUser) {
    const users = JSON.parse(localStorage.getItem('snake_users') || '[]');
    if (users.includes(savedUser)) {
      login(savedUser);
    } else {
      localStorage.removeItem(CURRENT_USER_KEY);
    }
  }
  
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    document.body.classList.add('is-mobile');
  }
}

appStart();
